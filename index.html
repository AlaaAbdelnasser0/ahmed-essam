<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ahmed Essam, Attorney at Law. WhatsApp, phone and office details.">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}</style>
<title>Ahmed Essam Contact Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: one narrow column like a printed visiting card held upright — emblem and signature on top, one WhatsApp action, then a ruled list of details. Single dark look, matching the logo. */
:root {
  color-scheme: dark;
  --ground: #0A0A0A;
  --panel: #14120D;
  --rule: #3A3120;
  --gold: #D4AF37;
  --gold-soft: #E9DFC2;
  --muted: #A89F88;
  --whatsapp: #1FAF5A;
  --on-whatsapp: #04140A;
  --display: 'Playfair Display', 'Times New Roman', serif;
  --body: 'IBM Plex Sans Arabic', 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
  --script: 'Aref Ruqaa', 'Noto Naskh Arabic', serif;
}
body {
  background: var(--ground);
  color: var(--gold-soft);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.5;
}
.card {
  max-width: 27rem;
  margin: 0 auto;
  padding-block: 2.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
.identity {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  text-align: center;
}
.emblem { width: 11rem; height: 11rem; }
.signature { width: 17rem; height: auto; }
.name {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.375rem;
  letter-spacing: 0.22em;
  margin-inline-end: -0.22em;
  color: var(--gold);
}
.role {
  margin: 0;
  font-family: var(--display);
  font-size: 0.8125rem;
  letter-spacing: 0.4em;
  margin-inline-end: -0.4em;
  text-transform: uppercase;
}
.role-ar {
  margin: 0;
  font-family: var(--script);
  font-size: 1.75rem;
  line-height: 1.2;
  color: var(--gold);
}
.whatsapp {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 1.25rem;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 0.5rem;
}
.whatsapp-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.625rem;
  min-height: 3rem;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  background: var(--whatsapp);
  color: var(--on-whatsapp);
  font-weight: 600;
  font-size: 1.0625rem;
  text-decoration: none;
}
.whatsapp-btn[aria-disabled="true"] {
  background: transparent;
  color: var(--muted);
  border: 1px dashed var(--rule);
}
.whatsapp-btn svg { width: 1.375rem; height: 1.375rem; flex-shrink: 0; }
.number-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.number {
  font-size: 1.125rem;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  user-select: all;
  min-width: 0;
}
.copy {
  font: inherit;
  font-size: 0.875rem;
  min-height: 2.75rem;
  padding: 0 1rem;
  border-radius: 0.375rem;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  cursor: pointer;
}
.details {
  margin: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--rule);
}
.detail {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  padding-block: 0.875rem;
  border-bottom: 1px solid var(--rule);
}
.detail dt {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-size: 0.8125rem;
  color: var(--muted);
}
.detail dt span:first-child { letter-spacing: 0.08em; text-transform: uppercase; }
.detail dd { margin: 0; font-size: 1.0625rem; min-width: 0; overflow-wrap: anywhere; }
.pending { color: var(--muted); font-style: italic; }
.detail dd a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 0.2em; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
</style>

</head>
<body>
<main class="card">
  <header class="identity">
    <svg class="emblem" viewBox="0 0 260 260" role="img" aria-label="Scales of justice inside a laurel wreath" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F7E08A"></stop>
          <stop offset="0.45" stop-color="#D4AF37"></stop>
          <stop offset="1" stop-color="#9C7A1E"></stop>
        </linearGradient>
        <path id="leaves" d="M130 232 C124 229 111 235 107 245 C116 246 128 241 130 232 Z M130 232 C123 233 112 227 109 217 C118 217 128 223 130 232 Z"></path>
        <g id="branch">
          <use href="#leaves" transform="rotate(10 130 130)"></use>
          <use href="#leaves" transform="rotate(24 130 130)"></use>
          <use href="#leaves" transform="rotate(38 130 130)"></use>
          <use href="#leaves" transform="rotate(52 130 130)"></use>
          <use href="#leaves" transform="rotate(66 130 130)"></use>
          <use href="#leaves" transform="rotate(80 130 130)"></use>
          <use href="#leaves" transform="rotate(94 130 130)"></use>
          <use href="#leaves" transform="rotate(108 130 130)"></use>
          <use href="#leaves" transform="rotate(122 130 130)"></use>
          <use href="#leaves" transform="rotate(136 130 130)"></use>
          <use href="#leaves" transform="rotate(150 130 130)"></use>
        </g>
      </defs>
      <g fill="url(#gold)" stroke="none">
        <use href="#branch"></use>
        <use href="#branch" transform="translate(260 0) scale(-1 1)"></use>
        <path d="M58 138 H106 Q82 157 58 138 Z"></path>
        <path d="M154 138 H202 Q178 157 154 138 Z"></path>
        <path d="M122 180 L130 196 L138 180 Z"></path>
        <path d="M130 58 L136 68 L130 78 L124 68 Z"></path>
        <circle cx="82" cy="90" r="3.5"></circle>
        <circle cx="178" cy="90" r="3.5"></circle>
      </g>
      <g fill="none" stroke="url(#gold)">
        <path d="M136 240 L130 232 A102 102 0 0 1 95.1 34.1" stroke-width="1.6"></path>
        <path d="M124 240 L130 232 A102 102 0 0 0 164.9 34.1" stroke-width="1.6"></path>
        <path d="M130 74 V184" stroke-width="4"></path>
        <path d="M82 90 Q106 83 130 97 Q154 83 178 90" stroke-width="3.5"></path>
        <path d="M82 90 L62 138 M82 90 L102 138 M178 90 L158 138 M178 90 L198 138" stroke-width="1.4"></path>
      </g>
    </svg>
    <img class="signature" src="signature-gold.png" width="1100" height="332" alt="Handwritten Arabic signature of Ahmed Essam">
    <h1 class="name">AHMED ESSAM</h1>
    <p class="role">Attorney at Law</p>
    <p class="role-ar" lang="ar" dir="rtl">المحامي</p>
  </header>

  <section class="whatsapp" aria-label="WhatsApp">
    <a class="whatsapp-btn" href="https://wa.me/201061666737" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.6A8.5 8.5 0 1 1 8.2 19.3z"></path><path d="M9 8.5c0 3 2.5 5.5 5.5 6l1.2-1.4-2-1-0.8 0.8c-1-0.5-1.8-1.3-2.3-2.3l0.8-0.8-1-2z"></path></svg>
      <span>Message on WhatsApp</span>
    </a>
    <div class="number-row">
      <span class="number" id="wa-number">01061666737</span>
      <button class="copy" id="copy-number" type="button">Copy number</button>
    </div>
  </section>

  <dl class="details">
    <div class="detail">
      <dt><span>Phone</span><span lang="ar" dir="rtl">الهاتف</span></dt>
      <dd style="direction: ltr; font-variant-numeric: tabular-nums"><a href="tel:+201020310100">01020310100</a><br><a href="tel:+201061666737">01061666737</a></dd>
    </div>
    <div class="detail">
      <dt><span>Office</span><span lang="ar" dir="rtl">عنوان المكتب</span></dt>
      <dd>Hadaiq El-Qubba, Cairo <span lang="ar" dir="rtl">· حدائق القبة، القاهرة</span></dd>
    </div>
    <div class="detail">
      <dt><span>Practice areas</span><span lang="ar" dir="rtl">مجالات العمل</span></dt>
      <dd>General practice <span lang="ar" dir="rtl">· جميع أنواع القضايا</span></dd>
    </div>
    <div class="detail">
      <dt><span>Working hours</span><span lang="ar" dir="rtl">مواعيد العمل</span></dt>
      <dd>24 hours <span lang="ar" dir="rtl">· على مدار 24 ساعة</span></dd>
    </div>
  </dl>
</main>

<script>
(function () {
  var btn = document.getElementById('copy-number');
  var num = document.getElementById('wa-number');
  btn.addEventListener('click', function () {
    var text = num.textContent.trim();
    function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy number'; }, 1600); }
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(num);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      btn.textContent = 'Number selected';
    }
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  });
})();
</script>
</body>
</html>
